<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin – Shape de Qualidade</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#fff;color:#111}header{background:#000;color:#fff;padding:16px 20px}header b{color:#d4a017;font-size:1.3rem;letter-spacing:1px}
main{padding:16px 20px;max-width:1100px;margin:auto}.k{display:flex;gap:12px;flex-wrap:wrap}.k div{border:2px solid #d4a017;border-radius:12px;padding:12px 16px;min-width:160px}.k b{display:block;font-size:1.4rem}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}.ok{color:#0a7d2c;font-weight:600}.no{color:#b00020;font-weight:600}
.t{background:#fff3cd;padding:2px 6px;border-radius:6px;font-size:.75rem}input,button{padding:8px;border-radius:8px;border:1px solid #ccc}button{background:#d4a017;border:0;font-weight:700}</style></head>
<body><header><b>SHAPE DE QUALIDADE</b> · Painel do dono</header><main>
<div class="k" id="k"></div><h3>Planos (preço mensal e limite de alunos – vazio = ilimitado)</h3><table id="pl"></table><p><button id="sv">Salvar planos</button> <span id="msg"></span></p><h3>Receita por plano</h3><table id="rp"></table>
<h3>Personais</h3><table id="ps"></table><h3>Pagamentos recentes</h3><table id="pg"></table></main>
<script>
const brl=c=>(c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),dt=t=>t?new Date(t).toLocaleDateString("pt-BR"):"–",e=s=>String(s??"").replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
async function load(){const d=await(await fetch("/api/admin/summary")).json();
 window.PL=d.plans;document.getElementById("pl").innerHTML="<tr><th>Plano</th><th>Preço (R$)</th><th>Limite de alunos</th><th>Personais ativos</th></tr>"+Object.entries(d.plans).map(([k,p])=>`<tr><td><b>${e(p.nome)}</b></td><td><input data-k="${k}" data-f="price" size="7" value="${(p.price_cents/100).toFixed(2).replace(".",",")}"></td><td><input data-k="${k}" data-f="limit" size="5" value="${p.limit??""}" placeholder="ilimitado"></td><td>${d.personals.filter(x=>x.sub.active&&x.sub.plan===k).length}</td></tr>`).join("");
 document.getElementById("rp").innerHTML="<tr><th>Plano</th><th>Pagamentos</th><th>Receita real</th><th>Incl. teste</th></tr>"+Object.entries(d.plans).map(([k,p])=>{const r=d.byPlan.find(x=>x.plan===k)||{n:0,real:0,total:0};return `<tr><td>${e(p.nome)}</td><td>${r.n}</td><td><b>${brl(r.real)}</b></td><td>${brl(r.total)}</td></tr>`}).join("");
 document.getElementById("k").innerHTML=`<div>Personais<b>${d.personals.length}</b></div><div>Assinaturas ativas<b>${d.ativos}</b></div><div>Receita real (30 dias)<b>${brl(d.last30.real)}</b></div><div>Receita real total<b>${brl(d.revenue.real)}</b></div><div>Pagamentos de teste<b>${brl(d.revenue.total-d.revenue.real)}</b></div><div>Pagamentos<b>${Object.entries(d.providers).filter(x=>x[1]).map(x=>x[0]).join(", ")}</b></div>`;
 document.getElementById("ps").innerHTML="<tr><th>Nome</th><th>E-mail</th><th>CREF</th><th>Plano</th><th>Alunos</th><th>Assinatura</th><th>Válida até</th><th>Desde</th></tr>"+d.personals.map(p=>`<tr><td>${e(p.nome)}</td><td>${e(p.email)}</td><td>${e(p.cref)}</td><td>${e(p.sub.plan_nome)}</td><td>${p.alunos}${p.sub.limit?" / "+p.sub.limit:""}</td><td class="${p.sub.active?"ok":"no"}">${p.sub.trial&&p.sub.active?"Teste grátis":p.sub.active?"Ativa":p.sub.status==="none"?"Nunca pagou":p.sub.status==="trial_expired"?"Teste acabou":"Vencida"} ${p.sub.provider==="demo"?'<span class="t">TESTE</span>':""}</td><td>${dt(p.sub.current_period_end)}</td><td>${dt(p.created_at)}</td></tr>`).join("");
 document.getElementById("pg").innerHTML="<tr><th>Data</th><th>Personal</th><th>Plano</th><th>Valor</th><th>Via</th><th>Status</th></tr>"+d.payments.map(p=>`<tr><td>${dt(p.created_at)}</td><td>${e(p.email)}</td><td>${e((d.plans[p.plan]||{}).nome||p.plan)}</td><td>${brl(p.amount_cents)}</td><td>${e(p.provider)} ${p.test?'<span class="t">TESTE</span>':""}</td><td>${e(p.status)}</td></tr>`).join("")}
document.getElementById("sv").onclick=async()=>{const b={};document.querySelectorAll("#pl input").forEach(i=>{(b[i.dataset.k]=b[i.dataset.k]||{})[i.dataset.f]=i.value.trim()});const r=await fetch("/api/admin/plans",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json();document.getElementById("msg").textContent=r.ok?"Salvo!":j.error;if(r.ok)load()};
load();
</script></body></html>
